<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee7d5">
  <meta name="description" content="מונה יניב בסגנון דף ועט">
  <title>מונה יניב — דף ניקוד</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="setup-view" class="setup-view">
      <div class="setup-title">
        <span class="pencil-mark" aria-hidden="true">✎</span>
        <div>
          <p class="kicker" data-i18n="newGame">משחק חדש</p>
          <h1 data-i18n="whoPlays">מי משחק?</h1>
        </div>
        <button id="language-button" class="paper-button language-button" type="button" aria-label="English">EN</button>
      </div>

      <form id="setup-form" class="paper-sheet">
        <div id="player-inputs" class="player-inputs"></div>
        <button id="add-player-button" class="ink-button" type="button">
          <span aria-hidden="true">＋</span>
          <span data-i18n="addPlayer">הוספת שחקן</span>
        </button>

        <fieldset class="rules">
          <legend data-i18n="paperRules">חוקי הדף</legend>
          <label>
            <input id="repeating-rule" type="checkbox" checked>
            <span data-i18n="repeatingRule">עיגול מספר חוזר מטה (122 ← 120)</span>
          </label>
          <label>
            <input id="fifty-rule" type="checkbox" checked>
            <span data-i18n="fiftyRule">הפחתת 50 בכפולות של 50</span>
          </label>
          <label>
            <input id="one-rule" type="checkbox" checked>
            <span data-i18n="oneRule">רק חוק אחד לשחקן בכל סיבוב</span>
          </label>
        </fieldset>

        <p id="setup-error" class="error" role="alert"></p>
        <button class="start-button" type="submit" data-i18n="startWriting">מתחילים לכתוב</button>
      </form>
    </section>

    <section id="game-view" class="game-view hidden">
      <div id="table-scroll" class="table-scroll">
        <table id="score-table">
          <thead>
            <tr id="score-head">
              <th class="round-column" scope="col" data-i18n="roundShort">סבב</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
        <div id="empty-note" class="empty-note" data-i18n="emptyNote">הדף עדיין נקי. סיימו סיבוב כדי להתחיל.</div>
      </div>

      <div class="game-actions">
        <button id="new-game-button" class="paper-button action-small" type="button" data-i18n-aria="newGame" aria-label="משחק חדש">↺</button>
        <button id="round-button" class="round-button" type="button">
          <span aria-hidden="true">✎</span>
          <span data-i18n="endRound">סיום סיבוב</span>
        </button>
        <button id="undo-button" class="paper-button action-small hidden" type="button" data-i18n-aria="undo" aria-label="ביטול">⌫</button>
        <button id="game-language-button" class="paper-button action-small language-button" type="button" aria-label="English">EN</button>
      </div>
    </section>
  </main>

  <dialog id="score-dialog" aria-labelledby="entry-label entry-player">
    <form id="score-form">
      <div class="entry-progress">
        <span id="entry-round"></span>
        <span id="entry-progress"></span>
      </div>
      <p id="entry-label" class="entry-label" data-i18n="enterScore">כמה נקודות ל־</p>
      <h2 id="entry-player"></h2>
      <div class="score-entry">
        <button id="sign-button" type="button" data-i18n-aria="changeSign" aria-label="שינוי סימן">±</button>
        <input id="score-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" data-i18n-aria="scoreField" aria-label="נקודות">
      </div>
      <p id="entry-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-entry" class="paper-button" type="button" data-i18n="cancel">ביטול</button>
        <button id="previous-player" class="paper-button hidden" type="button" data-i18n="back">חזרה</button>
        <button id="next-player" class="next-button" type="submit" data-i18n="next">הבא</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
